name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  uji:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, fileinfo, zip, sodium, pdo_sqlite, sqlite3, openssl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Pasang dependensi
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Periksa sintaks PHP
        run: |
          set -e
          find app config database routes tests -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Siapkan lingkungan
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan hub:demo

      - name: Jalankan uji
        run: php artisan test
